name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SHELLCHECK_VERSION: "0.11.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin ShellCheck so CI and local runs report the same codes.
      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck all scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

      - name: Validate every tracked JSON file
        run: git ls-files -z '*.json' | xargs -0 -n 1 sh -c 'python3 -m json.tool "$1" >/dev/null' sh

      - name: Version consistency (README vs CHANGELOG)
        run: |
          README_V=$(grep -m1 '^version:' README.md | awk '{print $2}')
          CHANGELOG_V=$(grep -m1 '^## ' CHANGELOG.md | sed 's/## //;s/ .*//')
          echo "README=$README_V CHANGELOG=$CHANGELOG_V"
          [ "$README_V" = "$CHANGELOG_V" ] || { echo "::error::Version mismatch"; exit 1; }

      # Gate 0 (T-073) requires tmux and jq; jq is preinstalled but the install is idempotent.
      - name: Install tmux and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      - name: Install tmux and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux jq

      # jsonschema is a test-only dependency; the harness runtime stays standard library.
      - name: Install test dependency jsonschema
        run: |
          python3 -m pip install jsonschema || python3 -m pip install --break-system-packages jsonschema
          python3 -c "import jsonschema"

      - name: Audit committed 2A evidence (old receipts must keep validating)
        run: python3 tests/test-evidence-2a.py

      - name: End-to-end install/update test
        run: bash tests/run-tests.sh
